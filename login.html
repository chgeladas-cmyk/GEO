<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GEO — Acesso</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="./app.css">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
<main class="w-full max-w-md">
  <section class="card shadow-lg">
    <div class="text-center mb-6">
      <div class="text-4xl mb-2">🔐</div>
      <h1 class="text-2xl font-bold text-blue-800">GEO</h1>
      <p class="text-sm text-gray-500">Acesso ao Carimbo Digital</p>
    </div>
    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-gray-600">USUÁRIO</label>
        <input id="username" type="text" autocomplete="username" required class="w-full">
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-600">SENHA / PIN</label>
        <input id="password" type="password" autocomplete="current-password" minlength="4" required class="w-full">
      </div>
      <button id="login-button" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700">ENTRAR</button>
      <p id="login-error" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded p-3"></p>
    </form>
    <p class="text-xs text-gray-400 text-center mt-6">Acesso local neste dispositivo.</p>
    <p class="text-center mt-2"><button id="forgot-password" type="button" class="text-xs text-blue-600 underline">Esqueci minha senha</button></p>
  </section>

  <section id="admin-setup" class="card shadow-lg mt-4 hidden">
    <h2 class="text-sm font-bold text-gray-700 mb-1">Primeiro acesso — Administrador</h2>
    <p class="text-xs text-gray-500 mb-3">Este aparelho ainda não tem senha de Administrador definida. Escolha uma agora (só quem for administrar o GEO precisa fazer isso).</p>
    <form id="admin-setup-form" class="space-y-3">
      <div><label class="block text-sm font-semibold text-gray-600">NOVA SENHA DO ADMIN</label><input id="admin-setup-password" type="password" minlength="4" required class="w-full"></div>
      <div><label class="block text-sm font-semibold text-gray-600">CONFIRMAR SENHA</label><input id="admin-setup-password-confirm" type="password" minlength="4" required class="w-full"></div>
      <div id="admin-setup-error" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded p-3"></div>
      <button class="w-full bg-gray-800 text-white font-bold py-2 rounded-lg">Definir senha do Administrador</button>
    </form>
  </section>
</main>
<script src="./usuarios.js"></script>
<script type="module">
import { authenticate, getCurrentUser, resetLocalAuthToDefault, isAdminSetupPending, setupAdminPassword } from "./authLocalService.js";
if (getCurrentUser()) location.replace("./index.html");

if (isAdminSetupPending()) {
  document.getElementById("admin-setup").classList.remove("hidden");
}

document.getElementById("admin-setup-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const errorEl = document.getElementById("admin-setup-error");
  errorEl.classList.add("hidden");
  const pw = document.getElementById("admin-setup-password").value;
  const pw2 = document.getElementById("admin-setup-password-confirm").value;
  if (pw !== pw2) {
    errorEl.textContent = "As senhas não coincidem.";
    errorEl.classList.remove("hidden");
    return;
  }
  try {
    await setupAdminPassword(pw);
    document.getElementById("admin-setup").classList.add("hidden");
    alert("Senha do Administrador definida neste aparelho. Você já pode entrar com o usuário admin.");
  } catch (err) {
    errorEl.textContent = err.message || "Não foi possível definir a senha.";
    errorEl.classList.remove("hidden");
  }
});

const form = document.getElementById("login-form");
const error = document.getElementById("login-error");
const button = document.getElementById("login-button");

document.getElementById("forgot-password").addEventListener("click", () => {
  const ok = confirm(
    "Isso vai apagar os usuários criados NESTE APARELHO e voltar o acesso para o padrão de fábrica. " +
    "Os dados de atividades, materiais e rascunhos não são afetados. Continuar?"
  );
  if (!ok) return;
  resetLocalAuthToDefault();
  alert("Acesso deste aparelho resetado. Entre novamente com o usuário técnico padrão.");
  location.reload();
});

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  error.classList.add("hidden");
  button.disabled = true;
  button.textContent = "ENTRANDO...";
  try {
    const result = await authenticate(
      document.getElementById("username").value,
      document.getElementById("password").value
    );
    if (result.ok) location.replace("./index.html");
    else {
      error.textContent = result.reason;
      error.classList.remove("hidden");
    }
  } catch (err) {
    error.textContent = "Não foi possível realizar o acesso.";
    error.classList.remove("hidden");
    console.error(err);
  } finally {
    button.disabled = false;
    button.textContent = "ENTRAR";
  }
});
</script>
</body>
</html>
