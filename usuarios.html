<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GEO — Usuários</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="./app.css">
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8">
<main class="max-w-5xl mx-auto">
<header class="flex flex-col sm:flex-row justify-between gap-3 items-start sm:items-center mb-6">
  <div><h1 class="text-2xl font-bold text-blue-800">Usuários</h1><p class="text-sm text-gray-500">Administração de acesso local</p></div>
  <div class="flex gap-2">
    <a href="./index.html" class="bg-gray-100 border px-4 py-2 rounded font-semibold">Voltar</a>
    <button data-action="logout" class="bg-red-600 text-white px-4 py-2 rounded font-semibold">Sair</button>
  </div>
</header>
<section class="card mb-5">
  <div class="flex flex-col sm:flex-row justify-between gap-3 items-start sm:items-center">
    <div><span class="font-bold">Usuários cadastrados</span><p id="current-admin" class="text-xs text-gray-500"></p></div>
    <button id="new-user" class="bg-blue-600 text-white px-4 py-2 rounded font-bold">+ Novo usuário</button>
  </div>
</section>
<section class="card overflow-x-auto">
<table class="w-full text-sm">
<thead><tr class="border-b text-left"><th class="p-2">Usuário</th><th class="p-2">Nome</th><th class="p-2">Perfil</th><th class="p-2">Status</th><th class="p-2 text-right">Ações</th></tr></thead>
<tbody id="users-body"></tbody>
</table>
</section>
</main>

<div id="modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
 <section class="bg-white rounded-xl w-full max-w-lg max-h-[92vh] overflow-y-auto p-5">
  <div class="flex justify-between items-center mb-4"><h2 id="modal-title" class="text-xl font-bold">Novo usuário</h2><button id="close-modal" class="text-2xl">×</button></div>
  <form id="user-form" class="space-y-3">
   <input type="hidden" id="user-id">
   <div><label class="text-sm font-semibold">USUÁRIO</label><input id="f-username" required class="w-full"></div>
   <div><label class="text-sm font-semibold">NOME</label><input id="f-name" required class="w-full"></div>
   <div><label class="text-sm font-semibold">PERFIL</label><select id="f-profile" class="w-full"><option>ADMIN</option><option>SUPERVISOR</option><option>TECNICO</option></select></div>
   <div><label class="text-sm font-semibold">SENHA / PIN <span id="password-hint" class="font-normal text-gray-400"></span></label><input id="f-password" type="password" minlength="4" class="w-full"></div>
   <label class="flex gap-2 items-center"><input id="f-active" type="checkbox" class="w-4 h-4"> Usuário ativo</label>
   <div><p class="text-sm font-bold mb-2">PERMISSÕES</p><div id="permissions" class="grid grid-cols-2 gap-2"></div></div>
   <div id="form-error" class="hidden text-sm text-red-600 bg-red-50 p-2 rounded"></div>
   <div class="flex gap-2 pt-2"><button type="button" id="cancel" class="flex-1 border py-2 rounded">Cancelar</button><button class="flex-1 bg-blue-600 text-white py-2 rounded font-bold">Salvar</button></div>
  </form>
 </section>
</div>
<script src="./usuarios.js"></script>
<script type="module">
import { initAuthUI } from "./auth-guard.js";
import { getUsers, createUser, updateUser, setUserPassword, getProfilePermissions } from "./authLocalService.js";

const me = initAuthUI({ permission: "usuarios" });
if (!me) throw new Error("Acesso negado");

const permissions = [
 ["atividades","Atividades"],["materiais","Materiais"],["ordens","Ordens"],
 ["relatorios","Relatórios"],["usuarios","Usuários"],["configuracoes","Configurações"]
];
const $ = id => document.getElementById(id);
const modal = $("modal"), form = $("user-form"), error = $("form-error");
let editing = null;

$("current-admin").textContent = `Logado como ${me.name || me.username}`;
function renderPermissions(selected=[]) {
  $("permissions").innerHTML = permissions.map(([key,label]) =>
    `<label class="flex gap-2 items-center text-sm"><input type="checkbox" value="${key}" class="perm w-4 h-4" ${selected.includes(key) ? "checked":""}>${label}</label>`
  ).join("");
}
function render() {
  $("users-body").innerHTML = getUsers().map(u => `
    <tr class="border-b">
      <td class="p-2 font-bold">${escapeHtml(u.username)}</td>
      <td class="p-2">${escapeHtml(u.name)}</td>
      <td class="p-2">${escapeHtml(u.profile)}</td>
      <td class="p-2"><span class="${u.active ? "text-green-700":"text-red-700"} font-semibold">${u.active ? "ATIVO":"BLOQUEADO"}</span></td>
      <td class="p-2 text-right whitespace-nowrap">
        <button class="edit border px-2 py-1 rounded mr-1" data-id="${u.id}">Editar</button>
        <button class="reset bg-amber-500 text-white px-2 py-1 rounded" data-id="${u.id}">Trocar senha</button>
      </td>
    </tr>`).join("");
}
function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}
function openNew() {
  editing = null; form.reset(); $("user-id").value=""; $("f-active").checked=true;
  $("modal-title").textContent="Novo usuário"; $("password-hint").textContent="(obrigatória, mínimo 4 caracteres)";
  renderPermissions(getProfilePermissions("TECNICO")); modal.classList.remove("hidden"); modal.classList.add("flex");
}
function openEdit(user) {
  editing = user; $("user-id").value=user.id; $("f-username").value=user.username; $("f-name").value=user.name;
  $("f-profile").value=user.profile; $("f-password").value=""; $("f-active").checked=user.active;
  $("modal-title").textContent="Editar usuário"; $("password-hint").textContent="(deixe vazia para manter)";
  renderPermissions(user.permissions); modal.classList.remove("hidden"); modal.classList.add("flex");
}
function close(){ modal.classList.add("hidden"); modal.classList.remove("flex"); error.classList.add("hidden"); }
$("new-user").onclick=openNew; $("close-modal").onclick=close; $("cancel").onclick=close;
$("f-profile").onchange=()=>{ if(!editing) renderPermissions(getProfilePermissions($("f-profile").value)); };
form.onsubmit=async e=>{
 e.preventDefault(); error.classList.add("hidden");
 const selected=[...document.querySelectorAll(".perm:checked")].map(x=>x.value);
 try {
   const data={username:$("f-username").value,name:$("f-name").value,profile:$("f-profile").value,active:$("f-active").checked,permissions:selected};
   if(editing){
     await updateUser(editing.id,data);
     if($("f-password").value) await setUserPassword(editing.id,$("f-password").value);
   } else {
     await createUser({...data,password:$("f-password").value});
   }
   close(); render();
 } catch(err){ error.textContent=err.message || "Erro ao salvar."; error.classList.remove("hidden"); }
};
document.addEventListener("click", e=>{
 const edit=e.target.closest(".edit"), reset=e.target.closest(".reset");
 if(edit){ const u=getUsers().find(x=>x.id===edit.dataset.id); if(u) openEdit(u); }
 if(reset){ const u=getUsers().find(x=>x.id===reset.dataset.id); if(!u) return; const p=prompt(`Nova senha para ${u.username}:`); if(p===null)return; setUserPassword(u.id,p).then(render).catch(err=>alert(err.message)); }
});
render();
</script>
</body>
</html>
